
# Database connection.
spring.liquibase.default-schema=management
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelogs/db.changelog-master.xml
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.password=password
spring.datasource.username=root
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/management
spring.jpa.hibernate.ddl-auto=none

# Actuator
management.security.enabled = false
management.server.port: 9000

# API variables
management.api.prefix=/api

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Swagger
logging.level.io.swagger.models.parameters.AbstractSerializableParameter: ERROR
